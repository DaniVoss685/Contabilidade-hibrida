    <div id="root"></div>
    <script>
      // Desregistra automaticamente qualquer Service Worker antigo de outros apps que tenha ficado no localhost:3000
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (const registration of registrations) {
            registration.unregister();
            console.log('[Dental Finance] Service Worker antigo desregistrado com sucesso:', registration);
          }
        });
      }
    </script>
