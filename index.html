  <body>
    <div id="root"></div>
    <script>
      // Remove apenas Service Workers de OUTROS apps que ficaram no mesmo host (ex.: localhost:3000).
      // O sw.js do Dental Finance é preservado — ele é o responsável pelo Web Push.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            var url = (registration.active || registration.waiting || registration.installing || {}).scriptURL || '';
            if (url && !/\/sw\.js(\?|$)/.test(url)) registration.unregister();
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
